[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snowgan"
version = "1.0.0"
description = "A GAN for practicing fine-tuning and generating images using the Rocky Mountain snowpack dataset (rmdig/rocky_mountain_snowpack)."
readme = "README.md"
authors = [
  { name="Denny Schaedig", email="dennys@rmdig.ai" }
]
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "matplotlib>=3.7",
  "pillow>=9.5",
  "datasets>=2.16",
  "click>=8.1",  # optional, if you use click/argparse
  # macOS: tensorflow-metal 1.2.0 dlopen-crashes against TF >= 2.20 (internal
  # .so layout changed); 2.19 is the newest verified pairing on Apple Silicon.
  'tensorflow>=2.18,<2.20; sys_platform == "darwin"',
  'tensorflow>=2.18; sys_platform != "darwin"',
]

[project.optional-dependencies]
# Pull in huggingface_hub only when callers want the weights pipeline
# (snowgan.weights.fetch and scripts/release_weights.py). Keeps the core
# install lean for users who don't fetch hosted backbones.
hub = [
  "huggingface_hub>=0.20",
]
# Apple-Silicon GPU support (PluggableDevice). NOTE: the Metal plugin has no
# accelerated Conv3D/Conv3DTranspose kernels (measured at CPU parity), so it
# does not speed up the current rank-5 architecture — see docs/UPGRADES.md.
metal = [
  'tensorflow-metal>=1.2; sys_platform == "darwin"',
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.scripts]
snowgan = "snowgan.main:main"
